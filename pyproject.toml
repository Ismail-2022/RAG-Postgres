[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pglens"
version = "0.1.0"
description = "RAG assistant over the PostgreSQL documentation, with citations"
requires-python = ">=3.9"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "pyyaml",
    "markdownify",
    "tenacity",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
